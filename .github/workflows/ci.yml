name: Windows build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned WebView2 SDK
        shell: powershell
        run: ./scripts/restore.ps1
      - name: Audit source
        run: node scripts/audit-source.cjs
      - name: Run isolated tests
        shell: powershell
        run: ./scripts/test.ps1
      - name: Build executable
        shell: powershell
        run: ./scripts/build.ps1 -NoRestore
      - name: Package
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TaskHarbor-windows-x64
          path: |
            dist/TaskHarbor-*-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
